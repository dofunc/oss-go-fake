version: 2

builds:
  - main: ./cmd/oss-go-fake
    binary: oss-go-fake
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }

archives:
  - formats: [binary]
    name_template: "oss-go-fake-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: dofunc
    name: oss-go-fake

dockers_v2:
  - images: ["ghcr.io/dofunc/oss-go-fake"]
    tags: ["{{ .Version }}", "latest"]
    platforms: [linux/amd64, linux/arm64]
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.source: https://github.com/dofunc/oss-go-fake
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
